x-application-environment: &application-environment
  DOTNET_ENVIRONMENT: Development
  ConnectionStrings__Database: "Server=sql,1433;Database=${APP_DB_NAME:-OrderInventory};User Id=sa;Password=${SQL_SA_PASSWORD:?Run scripts/Initialize-Local.ps1 first};Encrypt=True;TrustServerCertificate=True"
  Jwt__Issuer: ${JWT_ISSUER:-OrderInventory.Local}
  Jwt__Audience: ${JWT_AUDIENCE:-OrderInventory.Client}
  Jwt__SigningKeyBase64: ${JWT_SIGNING_KEY_BASE64:?Run scripts/Initialize-Local.ps1 first}
  Jwt__AccessTokenMinutes: ${JWT_ACCESS_TOKEN_MINUTES:-30}
  Bootstrap__AdminLogin: ${BOOTSTRAP_ADMIN_LOGIN:?Provide the approved bootstrap login}
  Bootstrap__AdminPassword: ${BOOTSTRAP_ADMIN_PASSWORD:?Run scripts/Initialize-Local.ps1 first}
  Bootstrap__StaffLogin: ${BOOTSTRAP_STAFF_LOGIN:?Provide the approved bootstrap login}
  Bootstrap__StaffPassword: ${BOOTSTRAP_STAFF_PASSWORD:?Run scripts/Initialize-Local.ps1 first}

services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-CU27-ubuntu-22.04@sha256:4402d880dd4c34bfa7d8705e56a86cd6c88da80a1f6bbbe741f999e76264a090
    platform: linux/amd64
    mem_limit: 2g
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_MEMORY_LIMIT_MB: "1024"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Run scripts/Initialize-Local.ps1 first}
      SQLCMDPASSWORD: ${SQL_SA_PASSWORD:?Run scripts/Initialize-Local.ps1 first}
    ports:
      - "127.0.0.1:${SQL_PORT:-14333}:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -Q 'SELECT 1' -b -C -l 5 >/dev/null"]
      interval: 5s
      timeout: 10s
      start_period: 30s
      retries: 24

  migrator:
    image: orderinventory-migrator:local
    platform: linux/amd64
    build:
      context: .
      target: migrator
    environment: *application-environment
    depends_on:
      sql:
        condition: service_healthy
    restart: "no"

  api:
    image: orderinventory-api:local
    platform: linux/amd64
    build:
      context: .
      target: api
    environment:
      <<: *application-environment
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      migrator:
        condition: service_completed_successfully

volumes:
  sql-data:
